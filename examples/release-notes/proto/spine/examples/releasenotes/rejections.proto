syntax = "proto3";

package spine.examples.releasenotes;

import "spine/examples/releasenotes/types.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.examples.releasenotes";

// Rejects opening a draft whose draft already exists.
message ReleaseDraftAlreadyOpen {
  // Identifies the release draft to which this domain outcome applies.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];
}

// Rejects an edit based on an older Entity Version.
message StaleReleaseEdit {
  // Identifies the release draft to which this domain outcome applies.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];
}

// Rejects approval of an older Entity Version or different Markdown bytes.
message StaleReleaseApproval {
  // Identifies the release draft to which this domain outcome applies.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];
}

// Rejects a generation identifier reused with different accepted input.
message ReleaseGenerationConflict {
  // Identifies the release draft to which this domain outcome applies.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Correlates this outcome with one accepted model generation.
  ReleaseGenerationId generation = 2 [(required) = true, (validate) = true];
}

// Rejects a stale Command or forbidden repository selection change.
message ReleaseInputsConflict {
  // Identifies the release draft to which this domain outcome applies.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];
}

// Rejects export when current content lacks exact approval.
message ReleaseExportUnavailable {
  // Identifies the release draft to which this domain outcome applies.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];
}
