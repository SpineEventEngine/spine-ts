syntax = "proto3";

package spine.examples.release_notes;

import "spine/examples/release_notes/types.proto";
import "spine/core/version.proto";
import "spine/options.proto";
import "spine/ts/agent/model.proto";

option (type_url_prefix) = "type.spine.examples.release_notes";

// Transactional draft and session-retained generation receipts.
message ReleaseDraftState {
  option (entity).kind = AGGREGATE;

  // Draft identifier; the framework supplies its required identity.
  ReleaseDraftId id = 1;

  // Editor-supplied title.
  ReleaseTitle title = 2 [(validate) = true];

  // Fixed repository and current comparison.
  ReleaseComparison comparison = 3 [(validate) = true];

  // Intended readers.
  string audience = 4;

  // Current structured document.
  ReleaseNotesDocument document = 5 [(validate) = true];

  // Exact approval, cleared on every content or input change.
  ReleaseApproval approval = 7 [(validate) = true];

  // Latest generation still eligible to stage a proposal.
  ReleaseGenerationId pending_generation = 8 [(validate) = true];

  // Historical Aggregate Version at acceptance of the pending generation.
  spine.core.Version pending_input_version = 9 [(validate) = true];

  // Session-retained accepted generation identities.
  repeated ReleaseGenerationReceipt receipts = 10 [(validate) = true];

  // Conversation used across later generations.
  spine.ts.agent.ConversationId conversation = 11 [(validate) = true];

  // Safe status of the latest generation.
  string generation_status = 12;
}

// Per-draft Agent progress, separate from its audited interaction history.
message ReleaseNotesAgentState {
  option (entity).kind = ENTITY;

  // Draft identifier; the framework supplies its required identity.
  ReleaseDraftId id = 1;

  // Conversation retained for generations for this draft.
  spine.ts.agent.ConversationId conversation = 2 [(validate) = true];

  // Most recently handled generation identity.
  ReleaseGenerationId generation = 3 [(validate) = true];
}

// Queryable editor summary driven only by Aggregate outcomes.
message ReleaseDraftView {
  option (entity).kind = PROJECTION;
  option (entity).visibility = QUERY;

  // Draft identifier; the framework supplies its required identity.
  ReleaseDraftId id = 1;

  // Current title.
  ReleaseTitle title = 2 [(validate) = true];

  // Current comparison.
  ReleaseComparison comparison = 3 [(validate) = true];

  // Intended readers.
  string audience = 4;

  // Current structured document.
  ReleaseNotesDocument document = 5 [(validate) = true];

  // Current approval if still valid.
  ReleaseApproval approval = 7 [(validate) = true];

  // Latest generation status.
  string generation_status = 8;

  // Latest requested generation identity.
  ReleaseGenerationId generation = 9 [(validate) = true];
}
