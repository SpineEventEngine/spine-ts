syntax = "proto3";

package spine.examples.release_notes;

import "spine/examples/release_notes/types.proto";
import "spine/core/version.proto";
import "spine/options.proto";
import "spine/ts/agent/model.proto";

option (type_url_prefix) = "type.spine.examples.release_notes";

// Records the initial editor-visible draft inputs.
message ReleaseDraftOpened {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Editor-supplied title.
  ReleaseTitle title = 2 [(required) = true, (validate) = true];

  // Fixed selected repository and initial comparison.
  ReleaseComparison comparison = 3 [(required) = true, (validate) = true];

  // Intended readers.
  string audience = 4 [(required) = true];
}

// Records changed source inputs and invalidates pending proposals.
message ReleaseInputsChanged {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // New comparison within the same repository selection.
  ReleaseComparison comparison = 2 [(required) = true, (validate) = true];

  // New intended readers.
  string audience = 3 [(required) = true];

  // Document after incompatible comparison content was cleared.
  ReleaseNotesDocument document = 5 [(validate) = true];
}

// Complete accepted input snapshot delivered to the per-draft Agent.
message ReleaseGenerationRequested {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Stable generation identity.
  ReleaseGenerationId generation = 2 [(required) = true, (validate) = true];

  // Historical Aggregate Version at generation acceptance.
  spine.core.Version input_version = 3 [(required) = true, (validate) = true];

  // Fixed comparison.
  ReleaseComparison comparison = 4 [(required) = true, (validate) = true];

  // Complete bounded catalog.
  ReleaseEvidenceCatalog catalog = 5 [(validate) = true];

  // Intended readers.
  string audience = 6 [(required) = true];

  // Current drafting instruction.
  ReleaseInstruction instruction = 7 [(required) = true, (validate) = true];

  // Current structured document.
  ReleaseNotesDocument current_document = 8 [(validate) = true];

  // Conversation reused for later generations.
  spine.ts.agent.ConversationId conversation = 9 [(required) = true, (validate) = true];

  // Nonsecret model/account selection.
  ReleaseModelSelection selection = 10 [(required) = true, (validate) = true];

  // Exact accepted snapshot identity for durable idempotence in this session.
  string input_digest = 11 [(required) = true];

  // Current editor-supplied title.
  ReleaseTitle title = 12 [(required) = true, (validate) = true];
}

// Acknowledges an exact accepted generation replay without starting another operation.
message ReleaseGenerationAlreadyRequested {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Previously accepted generation identity.
  ReleaseGenerationId generation = 2 [(required) = true, (validate) = true];

  // Digest of the original submitted Command identity.
  string input_digest = 3 [(required) = true];
}

// Agent-produced structured proposal, not yet an accepted document.
message ReleaseNotesProposed {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Original generation identity.
  ReleaseGenerationId generation = 2 [(required) = true, (validate) = true];

  // Original historical Aggregate Version at generation acceptance.
  spine.core.Version input_version = 3 [(required) = true, (validate) = true];

  // Validated structured proposal with evidence citations.
  ReleaseNotesDocument document = 4 [(required) = true, (validate) = true];

  // Audited model operation identity.
  spine.ts.agent.AiOperationId operation = 5 [(required) = true, (validate) = true];
}

// Agent-produced safe failure preserving the current document.
message ReleaseGenerationFailed {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Original generation identity.
  ReleaseGenerationId generation = 2 [(required) = true, (validate) = true];

  // Original historical Aggregate Version at generation acceptance.
  spine.core.Version input_version = 3 [(required) = true, (validate) = true];

  // Safe failure code, without credentials or provider prose.
  string reason = 4 [(required) = true];

  // Audited model operation identity.
  spine.ts.agent.AiOperationId operation = 5 [(required) = true, (validate) = true];
}

// Authoritative Aggregate decision applying the latest proposal.
message ReleaseNotesStaged {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Accepted generation identity.
  ReleaseGenerationId generation = 2 [(required) = true, (validate) = true];

  // Accepted structured document.
  ReleaseNotesDocument document = 4 [(required) = true, (validate) = true];
}

// Authoritative Aggregate decision keeping a stale proposal out of the draft.
message ReleaseProposalDiscarded {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Superseded generation identity.
  ReleaseGenerationId generation = 2 [(required) = true, (validate) = true];

}

// Records a failed latest generation without replacing the document.
message ReleaseGenerationStatusChanged {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Failed latest generation.
  ReleaseGenerationId generation = 2 [(required) = true, (validate) = true];

  // Safe failure code.
  string reason = 4 [(required) = true];
}

// Records one editor replacement of structured entries.
message ReleaseNotesEdited {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Replacement structured document.
  ReleaseNotesDocument document = 3 [(validate) = true];
}

// Records exact approved Markdown bytes for a reviewed document.
message ReleaseNotesApproved {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Immutable approved snapshot.
  ReleaseApproval approval = 2 [(required) = true, (validate) = true];
}

// Provides an immutable approved snapshot to the trusted export service.
message ReleaseNotesExportPrepared {
  // Draft identifier.
  ReleaseDraftId id = 1 [(required) = true, (validate) = true];

  // Correlated immutable approved snapshot.
  ReleaseApproval approval = 2 [(required) = true, (validate) = true];
}
