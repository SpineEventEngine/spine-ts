version: v2
plugins:
  - local: protoc-gen-es
    out: examples/todo/generated
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
  - local:
      - node
      - scripts/generate-rejections.mjs
    out: examples/todo/generated
    opt:
      - target=ts
      - import_extension=js
  - local:
      - node
      - packages/client/codegen/generate-entity-columns.mjs
    out: examples/todo/generated
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: examples/todo/proto
