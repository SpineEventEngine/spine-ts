syntax = "proto3";

package spine.example.todo.v1;

import "spine/example/todo/v1/task_id.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.example.todo";

// Represents a task aggregate and its current state.
message Task {
  option (entity).kind = AGGREGATE;

  // Identifies this task aggregate.
  TaskId id = 1 [
    (required) = true,
    (validate) = true,
    (set_once) = true
  ];
  // Stores the task title.
  string title = 2 [(required) = true];
  // Indicates whether the task is completed.
  bool completed = 3;
}
