syntax = "proto3";

package spine.examples.todo;

import "spine/examples/todo/tasks.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.examples.todo";

// A list of tasks with its count of open tasks.
message TaskList {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  // Identifies this task list.
  string id = 1 [
    (required) = true,
    (set_once) = true
  ];

  // The tasks in this list.
  repeated Task tasks = 2 [(validate) = true];

  // Counts tasks that are not completed.
  int32 open_task_count = 3 [(column) = true];
}
