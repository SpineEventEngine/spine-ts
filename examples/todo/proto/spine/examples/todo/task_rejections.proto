syntax = "proto3";

package spine.examples.todo;

import "spine/examples/todo/task_id.proto";
import "spine/core/user_id.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.examples.todo";

// Rejects an operation that requires an open task when it is already completed.
message TaskAlreadyDone {
  // Identifies the already completed task.
  TaskId id = 1 [
    (required) = true,
    (validate) = true
  ];
}

// Rejects reopening a task that is not completed.
message TaskNotDone {
  // Identifies the task that is not completed.
  TaskId id = 1 [
    (required) = true,
    (validate) = true
  ];
}

// Rejects assigning a task that already has an assignee.
message TaskAlreadyAssigned {
  // Identifies the assigned task.
  TaskId id = 1 [(required) = true, (validate) = true];

  // Identifies the task's current assignee.
  spine.core.UserId assignee = 2 [(required) = true, (validate) = true];

  // Identifies the task list that owns the assignment.
  TaskListId task_list_id = 3 [(required) = true, (validate) = true];
}

// Rejects an operation that requires an assigned task.
message TaskNotAssigned {
  // Identifies the unassigned task.
  TaskId id = 1 [(required) = true, (validate) = true];

  // Identifies the task list that owns the unassigned task.
  TaskListId task_list_id = 2 [(required) = true, (validate) = true];
}
