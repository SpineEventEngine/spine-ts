syntax = "proto3";

package spine.examples.todo;

import "spine/examples/todo/task_id.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.examples.todo";

// Creates a task with its identifier and initial title.
message CreateTask {
  // Identifies the task to create.
  TaskId id = 1 [
    (required) = true,
    (validate) = true
  ];

  // Specifies the initial task title.
  string title = 2 [(required) = true];
}

// Renames an existing task.
message RenameTask {
  // Identifies the task to rename.
  TaskId id = 1 [
    (required) = true,
    (validate) = true
  ];

  // Specifies the task's new title.
  string title = 2 [(required) = true];
}

// Marks an existing task as completed.
message CompleteTask {
  // Identifies the task to complete.
  TaskId id = 1 [
    (required) = true,
    (validate) = true
  ];
}

// Reopens a completed task.
message ReopenTask {
  // Identifies the task to reopen.
  TaskId id = 1 [
    (required) = true,
    (validate) = true
  ];
}
