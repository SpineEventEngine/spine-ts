syntax = "proto3";

package spine.examples.projects;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.examples.projects";

// Records a new project.
message ProjectCreated {
  // Uniquely identifies the created project.
  string id = 1 [(required) = true];

  // A name for the project.
  string name = 2 [(required) = true];
}

// Records a new task.
message TaskCreated {
  // Uniquely identifies the created task.
  string id = 1 [(required) = true];

  // The project containing the task.
  string project_id = 2 [(required) = true];
}

// Records an enrolled person.
message PersonEnrolled {
  // Uniquely identifies the enrolled person.
  string id = 1 [(required) = true];

  // A name for the person.
  string display_name = 2 [(required) = true];
}
