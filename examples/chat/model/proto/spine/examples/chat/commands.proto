syntax = "proto3";
package spine.examples.chat;

import "google/protobuf/timestamp.proto";
import "spine/examples/chat/chat.proto";
import "spine/examples/chat/users.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.examples.chat";

// Posts a message to a Chat room.
message PostMessage {

  // Identifies the message to post to the room.
  MessageId id = 1 [(required) = true, (validate) = true];

  // Identifies the room that receives the message.
  ChatRoomId room = 2 [(required) = true, (validate) = true];

  // Identifies the Chat user who posts the message.
  UserId author = 3 [(required) = true, (validate) = true];

  // Provides the text of the new message.
  string text = 4 [(required) = true];

  // Specifies when the user posted the message.
  google.protobuf.Timestamp posted_at = 5 [(required) = true];
}
