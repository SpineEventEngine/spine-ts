syntax = "proto3";
package spine.example.chat.v1;

import "spine/example/chat/v1/chat.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.example.chat";

// Rejects posting a message that already exists.
message MessageAlreadyPosted {
  // Identifies the message that was already posted.
  MessageId id = 1 [(required) = true, (validate) = true];
}
