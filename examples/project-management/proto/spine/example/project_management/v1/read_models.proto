// Provides a generic update counter for its handled event.
message AssignmentManager {
  option (entity).kind = PROCESS_MANAGER;

  // Identifies this process-manager instance.
  string id = 1 [(required) = true, (set_once) = true];
  // Counts updates triggered by the handled event.
  int32 updates = 2;
}

