// Records a fixed-topology example row for a triggering entity.
message ProjectSummary {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  // Records the triggering entity ID.
  string id = 1 [(required) = true, (set_once) = true];
  // Records the triggering entity name.
  string name = 2;
}

