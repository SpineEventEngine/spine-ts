version: v2
plugins:
  - local: protoc-gen-es
    out: examples/project-management/generated
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
  - local:
      - node
      - packages/client/codegen/generate-projection-columns.mjs
    out: examples/project-management/generated
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: examples/project-management/proto
