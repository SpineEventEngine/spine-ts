syntax = "proto3";

package spine.examples.support;

import "spine/examples/support/types.proto";
import "spine/options.proto";
import "spine/ts/agent/model.proto";

option (type_url_prefix) = "type.spine.examples.support";

// Opens the warehouse incident as a support ticket.
message OpenSupportTicket {
  // Ticket to create.
  SupportTicketId id = 1 [
    (required) = true,
    (validate) = true
  ];

  // Facts reported by the warehouse employee.
  SupportRequest request = 2 [
    (required) = true,
    (validate) = true
  ];
}

// Requests one human-reviewable draft for current ticket facts.
message DraftSupportReply {
  // Ticket receiving the requested draft.
  SupportTicketId id = 1 [
    (required) = true,
    (validate) = true
  ];

  // Current facts, including any updates since an earlier draft.
  SupportRequest request = 2 [
    (required) = true,
    (validate) = true
  ];

  // Explicit conversation to start or continue for this ticket.
  spine.ts.agent.ConversationId conversation = 3 [
    (required) = true,
    (validate) = true
  ];
}
