syntax = "proto3";

package spine.examples.support;

import "spine/examples/support/types.proto";
import "spine/options.proto";
import "spine/ts/agent/model.proto";

option (type_url_prefix) = "type.spine.examples.support";

// Current warehouse incident facts retained for one support ticket.
message SupportTicketState {
  option (entity).kind = AGGREGATE;

  // Ticket to which these incident facts belong.
  SupportTicketId id = 1 [
    (required) = true,
    (validate) = true
  ];

  // Most recently submitted warehouse facts.
  SupportRequest request = 2 [(validate) = true];
}

// Latest accepted reply draft for one warehouse support ticket.
message SupportDraftState {
  option (entity).kind = ENTITY;

  // Ticket for which this reply was drafted.
  SupportTicketId id = 1 [
    (required) = true,
    (validate) = true
  ];

  // Request that produced the current draft.
  SupportRequest request = 2 [(validate) = true];

  // Current validated reply awaiting review.
  SupportReply reply = 3 [(validate) = true];

  // Conversation used for the current draft.
  spine.ts.agent.ConversationId conversation = 4 [(validate) = true];
}

// Queryable result visible to a support person.
message SupportReviewState {
  option (entity).kind = PROJECTION;
  option (entity).visibility = QUERY;

  // Ticket whose draft is shown.
  SupportTicketId id = 1 [
    (required) = true,
    (validate) = true
  ];

  // Request facts associated with the latest proposal or failure.
  SupportRequest request = 2 [(validate) = true];

  // Latest usable draft, absent after a failed request.
  SupportReply reply = 3 [(validate) = true];

  // Conversation associated with this result.
  spine.ts.agent.ConversationId conversation = 4 [(validate) = true];

  // Whether the latest request produced a reviewable draft.
  bool has_draft = 5;

  // Whether the latest request failed while any previous accepted reply remains available.
  bool latest_request_failed = 6;
}
