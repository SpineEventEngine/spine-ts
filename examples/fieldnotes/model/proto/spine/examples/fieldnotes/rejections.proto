syntax = "proto3";

package spine.examples.fieldnotes;

import "spine/core/user_id.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.examples.fieldnotes";

// Refuses an unavailable place without exposing its state.
message PlaceUnavailable {
  // Identifies the requester who may observe this refusal.
  spine.core.UserId requester = 1;
}

// Refuses a second creation by the author of an existing place.
message PlaceAlreadyExists {
  // Identifies the requester who may observe this refusal.
  spine.core.UserId requester = 1;
}

// Refuses a stale edit after the author has been verified.
message PlaceRevisionConflict {
  // Identifies the requester who may observe this conflict.
  spine.core.UserId requester = 1;

  // Gives the author the current accepted revision.
  int32 current_revision = 2;
}

// Refuses geographic coordinates outside the valid finite ranges.
message InvalidPlaceCoordinates {
  // Identifies the requester who may observe this refusal.
  spine.core.UserId requester = 1;
}
