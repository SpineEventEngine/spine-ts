services:
  datastore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:cda01b8c880e9161992c3fd61d7d0e153b4dd073aa4a9d62ad79243907cf8dd4
    command:
      [
        gcloud,
        emulators,
        firestore,
        start,
        --database-mode=datastore-mode,
        --host-port=0.0.0.0:8081,
        --quiet,
      ]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 2s
      timeout: 2s
      retries: 30

  delivery:
    image: spine-ts/simple-delivery-server:local
    environment:
      HOST: 0.0.0.0
      PORT: 8484
    healthcheck:
      test:
        [
          CMD-SHELL,
          'node -e "const client=require(''node:http2'').connect(''http://127.0.0.1:8484'');client.on(''connect'',()=>{client.close();process.exit(0)});client.on(''error'',()=>process.exit(1));setTimeout(()=>process.exit(1),1000)"',
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  application-node-1: &application
    image: spine-ts/message-board:local
    command: [node_modules/@spine-event-engine/example-message-board-app/dist/src/multi-process-app.js]
    environment: &application-environment
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      DATASTORE_PROJECT_ID: distributed-message-board
      DATASTORE_EMULATOR_HOST: datastore:8081
      DELIVERY_SERVER_URL: http://delivery:8484
      PROCESS_COUNT: "2"
      DELIVERY_SHARD_COUNT: "2"
    depends_on:
      datastore:
        condition: service_healthy
      delivery:
        condition: service_healthy

  application-node-2:
    <<: *application
    environment: *application-environment

  gateway:
    image: spine-ts/standalone-gateway:local
    ports: ["${GATEWAY_PORT:-18080}:8080"]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      BROWSER_ORIGIN: http://127.0.0.1:5173
      BACKEND_URLS: http://application-node-1:8080,http://application-node-2:8080
      SUBSCRIPTION_REGISTRY_NAMESPACE: distributed-message-board
      DATASTORE_PROJECT_ID: distributed-message-board
      DATASTORE_EMULATOR_HOST: datastore:8081
    depends_on:
      datastore:
        condition: service_healthy
      delivery:
        condition: service_healthy
      application-node-1:
        condition: service_started
      application-node-2:
        condition: service_started
