syntax = "proto3";

package spine.examples.orders;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.examples.orders";

// Displays an order whose SKU name changes on later registration Events.
message OrderCard {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  // Identifies the order represented by this card.
  string id = 1 [
    (required) = true,
    (set_once) = true
  ];

  // Identifies the SKU in this order and supports routing catalog updates.
  string sku_id = 2 [(column) = true];

  // Displays a name from a later matching registration, or remains empty.
  string sku_name = 3;
}
