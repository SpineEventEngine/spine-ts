syntax = "proto3";
package spine.example.chat.v1;

import "google/protobuf/timestamp.proto";
import "spine/example/users/v1/users.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.example.chat";

message ChatRoomId {
  string value = 1 [(required) = true];
}

message MessageId {
  string value = 1 [(required) = true];
}

message ChatMessage {
  option (entity).kind = AGGREGATE;

  MessageId id = 1 [(required) = true, (validate) = true, (set_once) = true];
  ChatRoomId room = 2 [(required) = true, (validate) = true];
  spine.example.users.v1.UserId author = 3 [(required) = true, (validate) = true];
  string text = 4 [(required) = true];
  google.protobuf.Timestamp posted_at = 5 [(required) = true];
}

message ChatMessageView {
  option (entity).kind = PROJECTION;
  option (entity).visibility = FULL;

  MessageId id = 1 [(required) = true, (validate) = true, (set_once) = true];
  ChatRoomId room = 2 [(required) = true, (validate) = true, (column) = true];
  spine.example.users.v1.UserId author = 3 [(required) = true, (validate) = true, (column) = true];
  string text = 4 [(required) = true];
  google.protobuf.Timestamp posted_at = 5 [(required) = true, (column) = true];
}
