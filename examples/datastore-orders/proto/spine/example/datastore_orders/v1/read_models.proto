// Projection updated when a SKU is registered.
message SkuAuditView { option (entity).kind = PROJECTION; option (entity).visibility = FULL;
  // Copied from SkuRegistered.id.
  string id = 1 [(required) = true, (set_once) = true];
  // Copied from SkuRegistered.display_name.
