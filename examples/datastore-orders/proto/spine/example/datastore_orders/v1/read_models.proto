// Projection updated when a SKU is registered.
message SalesSkuIndex { option (entity).kind = PROJECTION; option (entity).visibility = FULL;
  // Copied from SkuRegistered.id.
  string id = 1 [(required) = true, (set_once) = true];
  // Copied from SkuRegistered.display_name.
  string value = 2;
}
// Process manager updated for created orders.
message OrderSalesManager { option (entity).kind = PROCESS_MANAGER;
  // Identifier supplied by the process manager.
  string id = 1 [(required) = true, (set_once) = true];
  // Number of applied updates.
  int32 updates = 2;
}
// Process manager updated for registered SKUs.
message SkuSalesManager { option (entity).kind = PROCESS_MANAGER;
  // Identifier supplied by the process manager.
  string id = 1 [(required) = true, (set_once) = true];
  // Number of applied updates.
  int32 updates = 2;
}
