syntax = "proto3";
package spine.example.datastore_orders.v1;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.example.datastore-orders";

// Projection updated when an order is created.
message OrderSummary { option (entity).kind = PROJECTION; option (entity).visibility = FULL;
  // Copied from OrderCreated.id.
  string id = 1 [(required) = true, (set_once) = true];
  // Copied from OrderCreated.sku_id.
  string value = 2;
}
// Projection updated when an order is created.
message SalesSummary { option (entity).kind = PROJECTION; option (entity).visibility = FULL;
  // Copied from OrderCreated.id.
  string id = 1 [(required) = true, (set_once) = true];
  // Copied from OrderCreated.sku_id.
  string value = 2;
}
// Projection updated when an order is created.
message OrderSkuView { option (entity).kind = PROJECTION; option (entity).visibility = FULL;
  // Copied from OrderCreated.id.
  string id = 1 [(required) = true, (set_once) = true];
  // Copied from OrderCreated.sku_id.
  string value = 2;
}
// Projection updated when an order is created.
message OrderAuditView { option (entity).kind = PROJECTION; option (entity).visibility = FULL;
  // Copied from OrderCreated.id.
