syntax = "proto3";
package spine.example.datastore_orders.v1;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.example.datastore-orders";

message OrderCreated {
  string id = 1 [(required) = true];
  string sku_id = 2 [(required) = true];
}

message SkuRegistered {
  string id = 1 [(required) = true];
  string display_name = 2 [(required) = true];
}
