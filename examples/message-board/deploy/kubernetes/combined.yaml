apiVersion: v1
kind: ConfigMap
metadata:
  name: message-board-config
data:
  BROWSER_ORIGIN: https://message-board.example.test
  SUBSCRIPTION_REGISTRY_NAMESPACE: message-board-production
  DELIVERY_SERVER_URL: http://simple-delivery-server:8484
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-board-combined
spec:
  replicas: 1
  selector: { matchLabels: { app: message-board-combined } }
  template:
    metadata: { labels: { app: message-board-combined } }
    spec:
      terminationGracePeriodSeconds: 10
      initContainers:
        - name: wait-for-delivery
          image: busybox:1.37.0
          command: ["sh", "-c", "until nc -z simple-delivery-server 8484; do sleep 1; done"]
      containers:
        - name: message-board
          image: spine-ts/message-board:local
          envFrom:
            [
              { configMapRef: { name: message-board-config } },
              { secretRef: { name: message-board-runtime } },
              { secretRef: { name: message-board-storage } },
            ]
          env:
            [
              { name: HOST, value: 0.0.0.0 },
              { name: PORT, value: "8080" },
              { name: NODE_ENV, value: production },
            ]
          startupProbe: { tcpSocket: { port: 8080 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-delivery-server
spec:
  replicas: 1
  selector: { matchLabels: { app: simple-delivery-server } }
  template:
    metadata: { labels: { app: simple-delivery-server } }
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: delivery
          image: spine-ts/simple-delivery-server:local
          env: [{ name: HOST, value: 0.0.0.0 }, { name: PORT, value: "8484" }]
          startupProbe: { tcpSocket: { port: 8484 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { tcpSocket: { port: 8484 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: simple-delivery-server }
spec:
  selector: { app: simple-delivery-server }
  ports: [{ port: 8484, targetPort: 8484 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-board-envoy
spec:
  replicas: 1
  selector: { matchLabels: { app: message-board-envoy } }
  template:
    metadata: { labels: { app: message-board-envoy } }
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.38.3@sha256:5f7c43e1147412fdb3af578c651c67478a3df818eae89d2261e707e06c209cdb
          args: ["-c", "/etc/envoy/envoy.yaml"]
          volumeMounts:
            - {
                name: envoy-config,
                mountPath: /etc/envoy/envoy.yaml,
                subPath: envoy.yaml,
                readOnly: true,
              }
            - { name: envoy-tls, mountPath: /run/tls, readOnly: true }
          startupProbe: { tcpSocket: { port: 8443 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { tcpSocket: { port: 8443 }, periodSeconds: 2 }
      volumes:
        - { name: envoy-config, configMap: { name: message-board-envoy-config } }
        - { name: envoy-tls, secret: { secretName: message-board-envoy-tls } }
---
apiVersion: v1
kind: Service
metadata: { name: message-board-combined }
spec:
  selector: { app: message-board-combined }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: message-board-envoy }
spec:
  type: LoadBalancer
  selector: { app: message-board-envoy }
  ports: [{ port: 443, targetPort: 8443 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: message-board-envoy-config }
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: browser_gateway
          address: { socket_address: { address: 0.0.0.0, port_value: 8443 } }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: { filename: /run/tls/tls.crt }
                        private_key: { filename: /run/tls/tls.key }
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: browser_gateway
                    stream_idle_timeout: 0s
                    codec_type: AUTO
                    route_config:
                      name: gateway_only
                      virtual_hosts:
                        - name: gateway
                          domains: ["*"]
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match: [{ exact: https://message-board.example.test }]
                              allow_methods: "POST, OPTIONS"
                              allow_headers: "content-type,x-grpc-web,authorization,x-user-agent,grpc-timeout"
                              expose_headers: "grpc-status,grpc-message"
                              max_age: "86400"
                          routes:
                            - match: { path: "/spine.auth.AuthenticationService/ResolveContext", headers: [{ name: ":method", exact_match: POST }] }
                              route: { cluster: gateway, timeout: 30s }
                            - match: { path: "/spine.client.CommandService/Post", headers: [{ name: ":method", exact_match: POST }] }
                              route: { cluster: gateway, timeout: 30s }
                            - match: { path: "/spine.client.QueryService/Read", headers: [{ name: ":method", exact_match: POST }] }
                              route: { cluster: gateway, timeout: 30s }
                            - match: { path: "/spine.client.SubscriptionService/Subscribe", headers: [{ name: ":method", exact_match: POST }] }
                              route: { cluster: gateway, timeout: 30s }
                            - match: { path: "/spine.client.SubscriptionService/Activate", headers: [{ name: ":method", exact_match: POST }] }
                              route: { cluster: gateway, timeout: 0s }
                            - match: { path: "/spine.client.SubscriptionService/Cancel", headers: [{ name: ":method", exact_match: POST }] }
                              route: { cluster: gateway, timeout: 30s }
                    http_filters:
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: gateway
          connect_timeout: 5s
          type: STRICT_DNS
          load_assignment:
            cluster_name: gateway
            endpoints:
              - lb_endpoints:
                  - endpoint: { address: { socket_address: { address: message-board-combined, port_value: 8080 } } }
