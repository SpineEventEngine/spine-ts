static_resources:
  listeners:
    - name: browser_gateway
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: browser_gateway
                route_config:
                  name: gateway_only
                  virtual_hosts:
                    - name: gateway
                      domains: ["*"]
                      routes:
                        - match: { path: "/spine.auth.AuthenticationService/ResolveContext" }
                          route: { cluster: gateway, timeout: 30s }
                        - match: { path: "/spine.client.CommandService/Post" }
                          route: { cluster: gateway, timeout: 30s }
                        - match: { path: "/spine.client.QueryService/Read" }
                          route: { cluster: gateway, timeout: 30s }
                        - match: { path: "/spine.client.SubscriptionService/Subscribe" }
                          route: { cluster: gateway, timeout: 30s }
                        - match: { path: "/spine.client.SubscriptionService/Activate" }
                          route: { cluster: gateway, timeout: 0s }
                        - match: { path: "/spine.client.SubscriptionService/Cancel" }
                          route: { cluster: gateway, timeout: 30s }
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: gateway
      connect_timeout: 2s
      type: LOGICAL_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: combined, port_value: 8080 }
