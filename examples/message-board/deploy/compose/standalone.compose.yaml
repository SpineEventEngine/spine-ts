services:
  web:
    image: spine-ts/message-board-web:local
    environment: { VITE_MESSAGE_BOARD_GATEWAY_URL: http://localhost:18080 }

  datastore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:578.0.0-emulators
    command:
      - gcloud
      - emulators
      - firestore
      - start
      - --database-mode=datastore-mode
      - --host-port=0.0.0.0:8081
      - --quiet
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 2s
      timeout: 2s
      retries: 30

  delivery:
    image: spine-ts/simple-delivery-server:local
    environment:
      HOST: 0.0.0.0
      PORT: 8484
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const client=require(''node:http2'').connect(''http://127.0.0.1:8484'');client.on(''connect'',()=>{client.close();process.exit(0)});client.on(''error'',()=>process.exit(1));setTimeout(()=>process.exit(1),1000)"',
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  application-node:
    image: spine-ts/message-board:local
    command:
      ["node_modules/@spine-event-engine/example-message-board-app/dist/src/multi-process-app.js"]
    environment: &application-environment
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      DATASTORE_PROJECT_ID: message-board-compose
      DATASTORE_EMULATOR_HOST: datastore:8081
      DELIVERY_SERVER_URL: http://delivery:8484
      PROCESS_COUNT: "2"
      DELIVERY_SHARD_COUNT: "2"
    depends_on:
      datastore:
        condition: service_healthy
      delivery:
        condition: service_healthy

  gateway:
    image: spine-ts/standalone-gateway:local
    environment: &gateway-environment
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      BROWSER_ORIGIN: http://localhost:18080
      BACKEND_URLS: http://application-node:8080
      SUBSCRIPTION_REGISTRY_NAMESPACE: message-board-standalone
      DATASTORE_PROJECT_ID: message-board-compose
      DATASTORE_EMULATOR_HOST: datastore:8081
    networks:
      default:
        aliases:
          - gateway
    depends_on:
      datastore:
        condition: service_healthy
      application-node:
        condition: service_started

  envoy:
    image: envoyproxy/envoy:v1.38.3@sha256:5f7c43e1147412fdb3af578c651c67478a3df818eae89d2261e707e06c209cdb
    command: ["-c", "/etc/envoy/envoy.yaml"]
    ports:
      - "18080:8080"
    volumes:
      - ./standalone-envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - gateway
      - web
