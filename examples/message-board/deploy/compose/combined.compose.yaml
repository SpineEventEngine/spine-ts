services:
  web:
    image: spine-ts/message-board-web:${MESSAGE_BOARD_IMAGE_TAG:-local}
    environment:
      {
        MESSAGE_BOARD_GATEWAY_URL: "https://localhost:${MESSAGE_BOARD_PUBLIC_PORT:-18080}",
        MESSAGE_BOARD_AUTH_MODE: "${MESSAGE_BOARD_AUTH_MODE:-public}",
      }

  datastore:
    image: google/cloud-sdk:578.0.0-emulators
    command:
      - gcloud
      - emulators
      - firestore
      - start
      - --database-mode=datastore-mode
      - --host-port=0.0.0.0:8081
      - --quiet
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 2s
      timeout: 2s
      retries: 30

  delivery:
    image: spine-ts/simple-delivery-server:${MESSAGE_BOARD_IMAGE_TAG:-local}
    environment:
      HOST: 0.0.0.0
      PORT: 8484
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const client=require(''node:http2'').connect(''http://127.0.0.1:8484'');client.on(''connect'',()=>{client.close();process.exit(0)});client.on(''error'',()=>process.exit(1));setTimeout(()=>process.exit(1),1000)"',
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  combined:
    image: spine-ts/message-board:${MESSAGE_BOARD_IMAGE_TAG:-local}
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      BROWSER_ORIGIN: "https://localhost:${MESSAGE_BOARD_PUBLIC_PORT:-18080}"
      DATASTORE_PROJECT_ID: message-board-compose
      DATASTORE_EMULATOR_HOST: datastore:8081
      DELIVERY_SERVER_URL: http://delivery:8484
      MESSAGE_BOARD_AUTH_MODE: ${MESSAGE_BOARD_AUTH_MODE:-public}
      MESSAGE_BOARD_SESSION_ISSUER: ${MESSAGE_BOARD_SESSION_ISSUER:-}
      MESSAGE_BOARD_SESSION_AUDIENCE: ${MESSAGE_BOARD_SESSION_AUDIENCE:-}
      MESSAGE_BOARD_SESSION_KEY_ID: ${MESSAGE_BOARD_SESSION_KEY_ID:-}
      MESSAGE_BOARD_SESSION_PRIVATE_KEY_PEM: ${MESSAGE_BOARD_SESSION_PRIVATE_KEY_PEM:-}
      MESSAGE_BOARD_READER_PROOF_KEY_BASE64: ${MESSAGE_BOARD_READER_PROOF_KEY_BASE64:-}
    depends_on:
      datastore:
        condition: service_healthy
      delivery:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:v1.38.3@sha256:5f7c43e1147412fdb3af578c651c67478a3df818eae89d2261e707e06c209cdb
    command: ["-c", "/etc/envoy/envoy.yaml"]
    ports:
      - "127.0.0.1:${MESSAGE_BOARD_PUBLIC_PORT:-18080}:8080"
    volumes:
      - ./combined-envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ${MESSAGE_BOARD_TLS_CERT_FILE:-../../web/.local/localhost-cert.pem}:/run/tls/tls.crt:ro
      - ${MESSAGE_BOARD_TLS_KEY_FILE:-../../web/.local/localhost-key.pem}:/run/tls/tls.key:ro
    depends_on:
      - combined
      - web
