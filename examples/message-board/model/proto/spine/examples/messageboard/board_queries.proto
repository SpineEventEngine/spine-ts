syntax = "proto3";
package spine.examples.messageboard;

import "spine/examples/messageboard/message_board.proto";
import "spine/options.proto";

option java_multiple_files = true;
option java_outer_classname = "BoardQueriesProto";
option java_package = "io.spine.examples.messageboard";
option (type_url_prefix) = "type.spine.examples.messageboard";

// Reads one message visible on the board.
message ReadBoardMessage {
  // Selects one message by its domain identifier.
  message Query {
    // The message to display.
    MessageId message = 1 [
      (required) = true,
      (validate) = true
    ];
  }

  // Returns the visible message, if it exists.
  message Response {
    // The matching message, when it remains visible.
    BoardMessageView message = 1;
  }
}
