syntax = "proto3";

package spine.agent;

import "google/protobuf/timestamp.proto";
import "spine/agent/model_call.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";

// Reports an unsuccessful model operation through a rejected CallModel Command.
message ModelCallFailed {
  // Metadata identifying the request and exact Agent destination.
  ModelCall call = 1 [
    (required) = true,
    (validate) = true
  ];

  // Safe explanation of the failure without credentials or raw provider data.
  string reason = 2 [(required) = true];

  // Whether a remote effect may have occurred without a known outcome.
  bool outcome_unknown = 3;

  // Time at which execution began, if it began.
  google.protobuf.Timestamp when_started = 4 [(validate) = true];

  // Time at which the failure was established.
  google.protobuf.Timestamp when_failed = 5 [
    (required) = true,
    (validate) = true
  ];
}
