syntax = "proto3";

package spine.agent;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "spine/agent/agent_id.proto";
import "spine/agent/model.proto";
import "spine/core/command.proto";
import "spine/core/event.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";

// Identifies one recorded model or tool request or response.
message ConversationRecordId {
  // Identifier assigned when the exchange is recorded.
  string value = 1 [(required) = true];
}

// Continuation returned by one Agent history read method.
message AgentHistoryCursor {
  // Opaque scope and complete ordering-key continuation.
  string value = 1 [(required) = true];
}

// One request or response exchanged with a model or tool.
message ConversationRecord {
  // Identity of this immutable record.
  ConversationRecordId id = 1 [
    (required) = true,
    (validate) = true
  ];

  // Conversation continued by this exchange.
  ConversationId conversation = 2 [
    (required) = true,
    (validate) = true
  ];

  // Model operation during which the exchange occurred.
  AiOperationId operation = 3 [
    (required) = true,
    (validate) = true
  ];

  // Occurrence timestamp supplied by Spine Time.
  google.protobuf.Timestamp when_occurred = 4 [
    (required) = true,
    (validate) = true
  ];

  // Exactly one documented generation, decision or tool content message.
  google.protobuf.Any content = 5 [
    (required) = true,
    (validate) = true
  ];

  // Physical model request when this record concerns a provider request.
  AiAttemptId attempt = 6 [(validate) = true];

  // Logical tool call when this record concerns external tool execution.
  AiToolCallId tool_call = 7 [(validate) = true];
}

// One prepared model request and the complete signal that triggered its creation.
message ModelRequestRecord {
  // Complete prepared CallModel Command, including ID, context, and typed payload.
  spine.core.Command request = 1 [
    (required) = true,
    (validate) = true
  ];

  // Complete triggering signal, retained without changing its metadata.
  oneof source {
    option (choice).required = true;

    // Command received by the requesting Agent.
    spine.core.Command command = 2 [(validate) = true];

    // Event received by the requesting Agent.
    spine.core.Event event = 3 [(validate) = true];
  }
}

// One immutable attempt to submit an already prepared model request.
message ModelSubmissionAttemptRecord {
  // Stable identity of this attempt, independent of its timestamp.
  string id = 1 [(required) = true];

  // Complete CallModel Command attempted, including when_submission_attempted.
  spine.core.Command command = 2 [
    (required) = true,
    (validate) = true
  ];

  // Time at which posting was attempted.
  google.protobuf.Timestamp when_attempted = 3 [
    (required) = true,
    (validate) = true
  ];
}

// One model outcome successfully handled and saved by the Agent.
message ModelOutcomeHandledRecord {
  // Stable identity of this handled occurrence.
  string id = 1 [(required) = true];

  // Logical model request whose outcome was handled.
  AiOperationId call = 2 [
    (required) = true,
    (validate) = true
  ];

  // Conversation continued by the handled outcome.
  ConversationId conversation = 3 [
    (required) = true,
    (validate) = true
  ];

  // Complete model reply or rejection Event received by the Agent.
  spine.core.Event outcome = 4 [
    (required) = true,
    (validate) = true
  ];

  // Time at which handling completed; this record is retained only if the commit succeeds.
  google.protobuf.Timestamp when_handled = 5 [
    (required) = true,
    (validate) = true
  ];
}

// One explicit decision to stop tracking a pending model request.
message ModelCallAbandonedRecord {
  // Stable identity of this abandonment occurrence.
  string id = 1 [(required) = true];

  // Logical model request no longer tracked as pending.
  AiOperationId call = 2 [
    (required) = true,
    (validate) = true
  ];

  // Conversation continued by the abandoned request.
  ConversationId conversation = 3 [
    (required) = true,
    (validate) = true
  ];

  // Time at which the application requested abandonment; retained on a successful commit.
  google.protobuf.Timestamp when_abandoned = 4 [
    (required) = true,
    (validate) = true
  ];

  // Complete signal whose handler explicitly abandoned the pending request.
  oneof source {
    option (choice).required = true;

    // Command received by the Agent before abandonment.
    spine.core.Command command = 5 [(validate) = true];

    // Event received by the Agent before abandonment.
    spine.core.Event event = 6 [(validate) = true];
  }
}

// One entry in the Agent's combined repository history.
message AgentHistoryEntry {
  // Original occurrence timestamp of the enclosed record or Event.
  google.protobuf.Timestamp when_occurred = 1 [
    (required) = true,
    (validate) = true
  ];

  // Exactly one recorded item in the combined history.
  oneof item {
    option (choice).required = true;

    // Model or tool request or response.
    ConversationRecord conversation_record = 2 [(validate) = true];

    // Original System Event concerning this Agent.
    spine.core.Event system_event = 3 [(validate) = true];

    // Original domain Event emitted by this Agent.
    spine.core.Event domain_event = 4 [(validate) = true];

    // Prepared model request and complete triggering signal.
    ModelRequestRecord model_request = 5 [(validate) = true];

    // Attempt to submit a prepared model request.
    ModelSubmissionAttemptRecord submission_attempt = 6 [(validate) = true];

    // Model outcome successfully applied by an Agent handler.
    ModelOutcomeHandledRecord handled_outcome = 7 [(validate) = true];

    // Explicit abandonment of a pending model request.
    ModelCallAbandonedRecord abandonment = 8 [(validate) = true];
  }

  // Complete typed identity of the Agent whose history contains this occurrence.
  AgentId agent = 9 [
    (required) = true,
    (validate) = true
  ];
}
