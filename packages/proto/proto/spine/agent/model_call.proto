syntax = "proto3";

package spine.agent;

import "google/protobuf/timestamp.proto";
import "spine/agent/agent_id.proto";
import "spine/agent/model.proto";
import "spine/core/bounded_context.proto";
import "spine/core/tenant_id.proto";
import "spine/core/version.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";

// Correlates one model request and its outcome with the requesting Agent.
message ModelCall {
  // Unique identity of the logical operation, including corrective attempts.
  AiOperationId id = 1 [
    (required) = true,
    (validate) = true
  ];

  // Bounded Context that receives the model outcome.
  spine.core.BoundedContextName reply_context = 2 [
    (required) = true,
    (validate) = true
  ];

  // Trusted tenant identity, when the Agent is in a multitenant application.
  spine.core.TenantId tenant = 3 [(validate) = true];

  // Exact Agent instance that requested the model call.
  AgentId agent = 4 [
    (required) = true,
    (validate) = true
  ];

  // Saved Agent version observed when the requesting handler began, if one existed.
  spine.core.Version agent_version = 5 [(validate) = true];

  // Registered model operation name.
  AiCapabilityName capability = 6 [
    (required) = true,
    (validate) = true
  ];

  // Exact revision of the registered operation definition.
  AiCapabilityRevision capability_revision = 7 [
    (required) = true,
    (validate) = true
  ];

  // Conversation continued by this request and its outcome.
  ConversationId conversation = 8 [
    (required) = true,
    (validate) = true
  ];

  // Time at which the Agent prepared this model request.
  google.protobuf.Timestamp when_requested = 9 [
    (required) = true,
    (validate) = true
  ];
}
