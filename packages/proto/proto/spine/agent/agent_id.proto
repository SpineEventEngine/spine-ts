syntax = "proto3";

package spine.agent;

import "google/protobuf/any.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";

// Identifies one Agent by its domain state type and typed Entity identifier.
message AgentId {
  // Type URL of the Agent's domain state message.
  string state_type_url = 1 [(required) = true];

  // Concrete Entity identifier packed with its original message type.
  google.protobuf.Any entity_id = 2 [
    (required) = true,
    (validate) = true
  ];
}
