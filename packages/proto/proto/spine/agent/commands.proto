syntax = "proto3";

package spine.agent;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "spine/agent/model.proto";
import "spine/agent/model_call.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";

// Requests asynchronous execution of a registered model operation.
message CallModel {
  // Immutable metadata used to correlate the request and its outcome.
  ModelCall call = 1 [
    (required) = true,
    (validate) = true
  ];

  // Selected deployment and configuration revision, without credentials.
  ModelRef model = 2 [
    (required) = true,
    (validate) = true
  ];

  // Typed input accepted for the registered operation.
  google.protobuf.Any input = 3 [
    (required) = true,
    (validate) = true
  ];

  // Time at which posting this Command was first attempted, when attempted.
  google.protobuf.Timestamp when_submission_attempted = 4 [(validate) = true];
}
