syntax = "proto3";

package spine.delivery;

import "google/protobuf/timestamp.proto";
import "spine/delivery/message_delivery.proto";
import "spine/options.proto";
import "spine/server/delivery/delivery.proto";

option java_multiple_files = true;
option (type_url_prefix) = "type.spine.io";

// Reads ordered Inbox pages with an exact position after a prior row.
service InboxReadService {
  rpc ReadPage(ReadInboxPage) returns (PageOfMessages);
}

// An exclusive position in Inbox receive-time, version, and message-ID order.
message InboxCursor {
  google.protobuf.Timestamp when_received = 1 [(required) = true];
  int32 version = 2;
  string message_id = 3 [(required) = true];
}

// A bounded read of one shard, optionally after an exact position.
message ReadInboxPage {
  spine.server.delivery.ShardIndex shard = 1 [(required) = true];
  InboxCursor after = 2;
  int32 page_size = 3;
  google.protobuf.Timestamp since_when = 4;
}
