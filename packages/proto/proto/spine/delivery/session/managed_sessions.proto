syntax = "proto3";

package spine.delivery.session;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "spine/options.proto";
import "spine/server/delivery/delivery.proto";

option java_multiple_files = true;
option (type_url_prefix) = "type.spine.io";

// Grants and maintains sessions used by automatic remote delivery.
service ManagedShardService {
  // Deliberately picks up a shard even when it contains no pending work.
  rpc PickShardRaw(DeliveryShardPickup) returns (DeliveryShardPickupOutcome);

  // Picks up pending work or recovers the live session of the same worker and attempt.
  rpc PickShardForDelivery(DeliveryShardPickup) returns (DeliveryShardPickupOutcome);

  // Extends only the live session named by the complete handle. A previously issued
  // handle for the same session ID remains valid after a completed renewal.
  rpc RenewShardSession(DeliverySessionHandle) returns (DeliverySessionHandle);

  // Releases only the live session named by the complete handle. A previously issued
  // handle for the same session ID remains valid after a completed renewal.
  rpc ReleaseShardSession(DeliverySessionHandle) returns (google.protobuf.Empty);
}

// Identifies one pickup attempt made by a stable worker.
message DeliveryShardPickup {
  // Identifies the shard requested for processing.
  spine.server.delivery.ShardIndex shard = 1 [(required) = true];

  // Identifies the worker for this independent processing run.
  spine.server.delivery.WorkerId worker = 2 [(required) = true];
}

// Identifies a session across renewals and carries its current lifetime.
message DeliverySessionHandle {
  // Identifies the shard granted to the worker.
  spine.server.delivery.ShardIndex shard = 1 [(required) = true];

  // Identifies the worker that received the session.
  spine.server.delivery.WorkerId worker = 2 [(required) = true];

  // Distinguishes this pickup from every later pickup and server process.
  string session_id = 3 [(required) = true];

  // Reports full-precision pickup or renewal wall time. A successful pickup samples again
  // after recording the session, so this may be later than Admin's retained time.
  // This timestamp is advisory; the session ID and server lease govern authority.
  google.protobuf.Timestamp when_picked = 4 [(required) = true];

  // Gives the interval after which a session without a renewal expires.
  google.protobuf.Duration lifetime = 5 [(required) = true];
}

// Reports a managed pickup, a competing session, or an empty pending queue.
message DeliveryShardPickupOutcome {
  // Describes the one definitive result of the pickup attempt.
  oneof result {
    // Grants the shard or recovers the same worker's live session.
    DeliverySessionHandle picked_up = 1;

    // Reports the session currently holding the shard.
    DeliveryShardBusy busy = 2;

    // Reports that the free shard contains no pending work.
    google.protobuf.Empty no_work = 3;
  }
}

// Describes the current holder of a busy shard without granting authority.
message DeliveryShardBusy {
  // Identifies the worker currently holding the shard.
  spine.server.delivery.WorkerId worker = 1 [(required) = true];

  // Reports the retained full-precision pickup or renewal wall time.
  google.protobuf.Timestamp when_picked = 2 [(required) = true];
}
