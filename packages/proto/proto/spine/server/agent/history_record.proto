syntax = "proto3";

package spine.server.agent;

import "spine/options.proto";
import "spine/ts/agent/history.proto";

option (SPI_all) = true;
option (type_url_prefix) = "type.spine.io";

// Canonical repository scope retained with one Agent history entry.
message AgentHistoryStorageKey {
  // Generated Agent state type name within the tenant boundary.
  string state_type = 1 [(required) = true];

  // Canonical storage key of the typed Agent identifier.
  string agent_key = 2 [(required) = true];
}

// Internal stored record containing the original complete history entry.
message AgentHistoryRecord {
  // Repository scope used for indexed reads and immutable identity.
  AgentHistoryStorageKey scope = 1 [
    (required) = true,
    (validate) = true
  ];

  // Original conversation record or Event envelope and occurrence time.
  spine.ts.agent.AgentHistoryEntry entry = 2 [
    (required) = true,
    (validate) = true
  ];
}
