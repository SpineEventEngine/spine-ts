syntax = "proto3";

package spine.server.agent;

import "spine/agent/agent_id.proto";
import "spine/agent/model.proto";
import "spine/agent/model_call.proto";
import "spine/options.proto";

option (SPI_all) = true;
option (type_url_prefix) = "type.spine.io";

// Framework-maintained attributes for one active Agent instance.
message ActiveAgentRecord {
  // Complete typed identity of this Agent.
  spine.agent.AgentId agent = 1 [
    (required) = true,
    (validate) = true
  ];

  // Complete model selections for the Agent; an empty list is valid.
  repeated spine.agent.ModelPreference model_preferences = 2 [(validate) = true];

  // Model requests awaiting a matching application handler commit or explicit abandonment.
  repeated spine.agent.ModelCall pending_model_calls = 3 [(validate) = true];
}
