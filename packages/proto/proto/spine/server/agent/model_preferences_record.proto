syntax = "proto3";

package spine.server.agent;

import "google/protobuf/any.proto";
import "spine/options.proto";
import "spine/ts/agent/model.proto";

option (SPI_all) = true;
option (type_url_prefix) = "type.spine.io";

// Complete Agent instance identity for retained model selections.
message AgentModelPreferencesKey {
  // Generated Agent state type name.
  string state_type = 1 [(required) = true];

  // Exact typed Agent identifier including its original type URL and bytes.
  google.protobuf.Any recipient_id = 2 [
    (required) = true,
    (validate) = true
  ];
}

// Current model selections without an executable Agent invocation.
message AgentModelPreferencesRecord {
  // Complete identity evidence for the provider's bounded record slot.
  AgentModelPreferencesKey key = 1 [
    (required) = true,
    (validate) = true
  ];

  // Complete per-instance model selections; an empty list is valid.
  repeated spine.ts.agent.ModelPreference preferences = 2 [(validate) = true];
}
