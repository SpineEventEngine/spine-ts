syntax = "proto3";

package spine.auth;

import "spine/client/subscription.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_multiple_files = true;

// A public Gateway definition retained solely for abrupt-process orphan cleanup.
message GatewayPublicSubscription {
    spine.client.SubscriptionId id = 1 [(required) = true, (validate) = true];
    spine.client.Subscription subscription = 2 [(required) = true, (validate) = true];
}
