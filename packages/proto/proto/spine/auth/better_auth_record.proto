syntax = "proto3";

package spine.auth;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "spine/options.proto";

option java_multiple_files = true;
option (type_url_prefix) = "type.spine.io";

// Persisted native identity selected for administrator provisioning.
message BetterAuthUserRecord {
  // Stable native user identifier and storage slot.
  string id = 1;

  // Display name supplied by the identity source.
  string name = 2;

  // Unique normalized login email.
  string email = 3;

  // Whether the identity source verified the email.
  bool email_verified = 4;

  // Optional profile image URL.
  google.protobuf.StringValue image = 5;

  // Original user creation instant.
  google.protobuf.Timestamp created_at = 6;

  // Most recent user update instant.
  google.protobuf.Timestamp updated_at = 7;
}

// Persisted credential or prelinked provider account.
message BetterAuthAccountRecord {
  // Canonical provider and subject storage slot.
  string id = 1;

  // Stable linked user identifier.
  string user_id = 2;

  // Provider subject identifier.
  string account_id = 3;

  // Configured provider identifier.
  string provider_id = 4;

  // Optional password hash, never plaintext.
  google.protobuf.StringValue password = 5;

  // Original account creation instant.
  google.protobuf.Timestamp created_at = 6;

  // Most recent account update instant.
  google.protobuf.Timestamp updated_at = 7;
}

// Native session whose token is its sole stable identity.
message BetterAuthSessionRecord {
  // Session token and storage slot.
  string id = 1;

  // Stable linked user identifier.
  string user_id = 2;

  // Authoritative native session deadline.
  google.protobuf.Timestamp expires_at = 3;

  // Original session creation instant.
  google.protobuf.Timestamp created_at = 4;

  // Most recent session update instant.
  google.protobuf.Timestamp updated_at = 5;

  // Optional client IP address.
  google.protobuf.StringValue ip_address = 6;

  // Optional client user agent.
  google.protobuf.StringValue user_agent = 7;
}

// One immutable native verification value per purpose-qualified identifier.
message BetterAuthVerificationRecord {
  // Canonical purpose-qualified storage slot.
  string id = 1;

  // Native purpose-qualified identifier.
  string identifier = 2;

  // One immutable verification value.
  string value = 3;

  // Authoritative verification deadline.
  google.protobuf.Timestamp expires_at = 4;

  // Original verification creation instant.
  google.protobuf.Timestamp created_at = 5;

  // Most recent verification update instant.
  google.protobuf.Timestamp updated_at = 6;
}
