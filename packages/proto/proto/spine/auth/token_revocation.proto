syntax = "proto3";

package spine.auth;

import "google/protobuf/timestamp.proto";
import "spine/options.proto";

option java_multiple_files = true;
option (type_url_prefix) = "type.spine.io";

// One scoped signed-token revocation retained through its last acceptance instant.
message TokenRevocation {
  // SHA-256 storage identity of the issuer, audience and token ID tuple.
  string id = 1;

  // Exact issuing service identity used to scope the token ID.
  string issuer = 2;

  // Exact intended recipient identity used to scope the token ID.
  string audience = 3;

  // Token identifier retained for immediate revocation.
  string token_id = 4;

  // Inclusive last instant at which the token may still be accepted.
  google.protobuf.Timestamp when_expires = 5;
}
