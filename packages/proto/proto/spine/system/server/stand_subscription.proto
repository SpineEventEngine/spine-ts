syntax = "proto3";

package spine.system.server;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option (internal_all) = true;
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

import "spine/client/subscription.proto";

// A durable definition of one Stand subscription.
message StandSubscriptionRecord {

    // The subscription definition, including its canonical topic.
    spine.client.Subscription subscription = 1;

    // The lifecycle state of the subscription.
    SubscriptionPhase phase = 2;

    // The time when the subscription was created.
    google.protobuf.Timestamp created_at = 3;

    // The deadline for activating a pending subscription.
    google.protobuf.Timestamp pending_until = 4;

    // The revision used to coordinate concurrent registry updates.
    uint64 revision = 5;

    // A random, opaque 16-byte token that identifies this definition lifetime.
    // It is internal recovery fencing metadata and changes on recreation.
    bytes generation = 6;
}

// A lifecycle state of a durable Stand subscription.
enum SubscriptionPhase {

    SUBSCRIPTION_PHASE_UNSPECIFIED = 0;

    PENDING = 1;

    ACTIVE = 2;
}
