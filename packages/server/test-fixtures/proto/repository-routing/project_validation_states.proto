syntax = "proto3";

package repository_routing_project_validation;

import "repository-routing/project_validation_identifiers.proto";
import "spine/options.proto";

message ProjectSubmissionState {
  option (entity).kind = AGGREGATE;
  string id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
}

message AcceptedProjectSubmissionState {
  option (entity).kind = AGGREGATE;
  repository_routing_project_validation_identifiers.ProjectSubmissionId id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
}
