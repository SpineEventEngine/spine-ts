syntax = "proto3";

package repository_routing;

import "repository-routing/project_identifiers.proto";
import "repository-routing/project_states.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";

message GetProjectOverview {
  message Query {
    ProjectId project = 1 [
      (required) = true,
      (validate) = true
    ];
  }

  message Response {
    ProjectOverviewState project = 1;
  }
}
