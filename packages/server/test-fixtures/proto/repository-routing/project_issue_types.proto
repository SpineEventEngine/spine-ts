syntax = "proto3";

package repository_routing;

import "google/protobuf/any.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";

// One issue included in an application-level project read view.
message ProjectIssueView {
  // Identifier of this issue.
  string id = 1;

  // Title shown for this issue.
  string title = 2;

  // Another issue referenced by this issue.
  ProjectIssueView related = 3;
}

// An intermediate section containing an issue selected for review.
message ProjectIssueSection {
  // Issue selected for this section.
  ProjectIssueView issue = 1;
}

// Project read view with each supported nested Proto message container.
message ProjectIssuesView {
  // Identifier of the project containing these issues.
  string project_id = 1;

  // Main issue shown for the project.
  ProjectIssueView primary = 2;

  // Issue list displayed for the project.
  repeated ProjectIssueView issues = 3;

  // Issues indexed by a caller-visible key.
  map<string, ProjectIssueView> issue_by_key = 4;

  // Chooses a featured issue or a text label.
  oneof featured {
    // Issue highlighted in the project view.
    ProjectIssueView featured_issue = 5;

    // Text shown when no featured issue is selected.
    string featured_label = 6;
  }

  // Packed attachment associated with the project.
  google.protobuf.Any attachment = 7;

  // Packed attachments in display order.
  repeated google.protobuf.Any attachments = 8;

  // Packed attachments indexed by a caller-visible key.
  map<string, google.protobuf.Any> attachment_by_key = 9;

  // Nested section containing a selected issue.
  ProjectIssueSection section = 10;
}
