syntax = "proto3";

package repository_routing;

import "spine/options.proto";
import "repository-routing/project_identifiers.proto";

message ProjectOverviewState {
  option (entity).kind = PROJECTION;
  string id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
  int32 priority = 3 [(column) = true];
}

message ProjectState {
  option (entity).kind = AGGREGATE;
  option (entity).visibility = QUERY;
  string id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
  bool archived = 3;
}

message RegisteredProjectState {
  option (entity).kind = AGGREGATE;
  ProjectId id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
  int32 priority = 3 [(column) = true];
}

message ProjectBacklogState {
  option (entity).kind = PROJECTION;
  string id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
  int32 priority = 3 [(column) = true];
}

message NumberedProjectState {
  option (entity).kind = AGGREGATE;
  int32 id = 1 [(set_once) = true];
  string name = 2;
}

message ProjectWorkflowState {
  option (entity).kind = PROCESS_MANAGER;
  int64 id = 1 [(set_once) = true];
  string queue = 2;
}

message ProjectQueueState {
  option (entity).kind = PROCESS_MANAGER;
  option (entity).visibility = SUBSCRIBE;
  string id = 1;
  string queue = 2 [(column) = true];
}

message SequencedProjectOverviewState {
  option (entity).kind = PROJECTION;
  ProjectSequenceId id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
}

message SequencedProjectSourceState {
  option (entity).kind = PROJECTION;
  ProjectSequenceId id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
}

message ProjectMilestoneOverviewState {
  option (entity).kind = PROJECTION;
  ProjectMilestoneId id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
}

message ProjectMilestoneState {
  option (entity).kind = AGGREGATE;
  ProjectMilestoneId id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
}

message ProjectMilestoneWorkflowState {
  option (entity).kind = PROCESS_MANAGER;
  ProjectMilestoneId id = 1 [(set_once) = true];
  string queue = 2;
}

message ProjectMilestoneSourceState {
  option (entity).kind = PROJECTION;
  ProjectMilestoneId id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
}
