syntax = "proto3";

package entity_metadata;

import "spine/options.proto";

option (every_is).java_type = "example.tags.ASharedTag";

message ProjectOverviewState {
  option (entity).kind = PROJECTION;
  option (is).java_type = "example.tags.ZProjectionTag";

  string id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
  int32 priority = 3 [(column) = true];
}

message ProjectState {
  option (entity).kind = AGGREGATE;
  option (entity).visibility = QUERY;
  option (is).java_type = "example.tags.AggregateTag";

  string id = 1 [(set_once) = true];
  string name = 2 [(column) = true];
  bool archived = 3;
}

message ProjectSearchState {
  option (entity).kind = ENTITY;
  option (is).java_type = "example.tags.ASharedTag";

  string id = 1;
  string searchable = 2 [(column) = true];
}

message ProjectProfile {
  string value = 1;
  ProjectProfile child = 2;
}

message ProjectProfileState {
  option (entity).kind = PROJECTION;

  string id = 1 [(set_once) = true];
  bytes fingerprint = 2 [(set_once) = true];
  repeated string tags = 3 [(set_once) = true];
  ProjectProfile details = 4 [(set_once) = true];
  string mutable_note = 5;
}

message ProjectCatalogState {
  option (entity).kind = PROJECTION;

  string id = 1 [(set_once) = true];
  map<string, string> labels = 2 [(set_once) = true];
  string mutable_note = 3;
}

message ProjectRecordState {
  option (entity).kind = PROJECTION;

  string id = 1 [(set_once) = true];
  bytes fingerprint = 2 [(set_once) = true];
  ProjectProfile details = 3 [(set_once) = true];
  string mutable_note = 4;
}

message ProjectDraftState {
  option (entity).kind = PROJECTION;

  string id = 1 [(set_once) = true];
  optional string explicit_id = 2 [(set_once) = true];
  string mutable_note = 3;
}

// Identifies a Projection state with a message-shaped ID.
message ProjectOverviewId {
  // The identifier value.
  string value = 1;
}

// Provides a Projection state identified by a Proto message.
message ProjectPortfolioState {
  option (entity).kind = PROJECTION;

  // The Projection identifier.
  ProjectOverviewId id = 1 [(set_once) = true];

  // A queryable name.
  string name = 2 [(column) = true];
}

message NumberedProjectState {
  option (entity).kind = AGGREGATE;

  int32 id = 1 [(set_once) = true];
  string name = 2;
}

message ProjectWorkflowState {
  option (entity).kind = PROCESS_MANAGER;

  int64 id = 1 [(set_once) = true];
  string queue = 2;
}

message PublishedProjectState {
  option (entity).kind = PROJECTION;

  string id = 1 [(required) = true];
}

message DraftProjectState {
  option (entity).kind = PROJECTION;

  string id = 1 [(required) = false];
}
