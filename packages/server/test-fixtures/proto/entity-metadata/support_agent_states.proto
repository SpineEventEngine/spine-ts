syntax = "proto3";

package spine.server.testing;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.server.testing";

// Identifies a support reply drafting Agent for one ticket.
message SupportReplyAgentId {
  // Identifies the support ticket handled by this Agent.
  string ticket_number = 1 [(required) = true];
}

// Records the Agent's progress drafting a support ticket reply.
message SupportReplyAgentState {
  option (entity).kind = ENTITY;

  // Identifies the Agent for this ticket.
  SupportReplyAgentId id = 1 [
    (required) = true,
    (validate) = true,
    (set_once) = true
  ];

  // Stores the latest reply proposed for human review.
  string proposed_reply = 2;
}

// Identifies one support article available to reply drafting.
message SupportKnowledgeId {
  // Distinguishes the article in the support library.
  string article_number = 1 [(required) = true];
}

// Exposes approved support knowledge through a query projection.
message SupportKnowledgeState {
  option (entity).kind = PROJECTION;
  option (entity).visibility = QUERY;

  // Identifies the support article.
  SupportKnowledgeId id = 1 [
    (required) = true,
    (validate) = true,
    (set_once) = true
  ];

  // Contains the approved answer text.
  string answer = 2 [(column) = true];
}
