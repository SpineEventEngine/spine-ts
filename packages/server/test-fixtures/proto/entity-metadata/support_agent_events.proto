syntax = "proto3";

package spine.server.testing;

import "entity-metadata/support_agent_states.proto";
import "spine/options.proto";

option (type_url_prefix) = "type.spine.server.testing";

// Records that an Agent proposed a reply for human review.
message SupportReplyDrafted {
  // Identifies the support ticket.
  SupportReplyAgentId agent = 1;

  // Contains the reply proposed for review.
  string reply = 2;
}

// Announces that a support ticket received a new customer message.
message SupportTicketUpdated {
  // Identifies the support ticket.
  SupportReplyAgentId agent = 1;

  // Contains the customer's latest question.
  string question = 2;
}
