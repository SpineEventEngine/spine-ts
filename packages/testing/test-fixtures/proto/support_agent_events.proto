syntax = "proto3";

package spine_ts.testing.support;

import "spine/options.proto";
import "support_agent_states.proto";

// Records a typed support draft proposed for human review.
message SupportReplyProposed {
  // Ticket whose reply was drafted.
  SupportReplyAgentId agent = 1 [
    (required) = true,
    (validate) = true
  ];

  // Proposed text admitted from the AI capability.
  string reply = 2 [(required) = true];
}

// Records that an AI draft could not be admitted for this ticket.
message SupportReplyDraftFailed {
  // Ticket whose requested draft failed.
  SupportReplyAgentId agent = 1 [
    (required) = true,
    (validate) = true
  ];

  // Safe operational category, without provider text or credentials.
  string reason_code = 2 [(required) = true];
}
