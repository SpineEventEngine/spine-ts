version: v2
modules:
  - path: packages/proto/proto
  - path: examples/todo/proto
  - path: examples/project-management/proto
  - path: examples/datastore-orders/proto
lint:
  use:
    - STANDARD
  except:
    # Spine upstream protos are copied verbatim. These exceptions preserve
    # compatibility choices such as package-less options and legacy enum names.
    - PACKAGE_DEFINED
    - PACKAGE_VERSION_SUFFIX
    - FIELD_LOWER_SNAKE_CASE
    - ENUM_NO_ALLOW_ALIAS
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - PACKAGE_SAME_JAVA_PACKAGE
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  ignore_only:
    SERVICE_SUFFIX:
      - packages/proto/proto/grpc/health/v1/health.proto
    PACKAGE_DIRECTORY_MATCH:
      - packages/proto/proto/spine/delivery/admin/admin_service.proto
    PACKAGE_SAME_DIRECTORY:
      - packages/proto/proto/spine/delivery/admin/admin_service.proto
      - packages/proto/proto/spine/delivery/commands.proto
      - packages/proto/proto/spine/delivery/events.proto
      - packages/proto/proto/spine/delivery/message_delivery.proto
      - packages/proto/proto/spine/delivery/pick_up_outcome.proto
      - packages/proto/proto/spine/delivery/rejections.proto
    PACKAGE_SAME_JAVA_MULTIPLE_FILES:
      - packages/proto/proto/spine/delivery/admin/admin_service.proto
      - packages/proto/proto/spine/delivery/commands.proto
      - packages/proto/proto/spine/delivery/events.proto
      - packages/proto/proto/spine/delivery/message_delivery.proto
      - packages/proto/proto/spine/delivery/pick_up_outcome.proto
      - packages/proto/proto/spine/delivery/rejections.proto
breaking:
  use:
    - FILE
