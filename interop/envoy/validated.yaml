static_resources:
  listeners:
    - name: browser_gateway
      address:
        socket_address: { address: 127.0.0.1, port_value: 8443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /run/tls/cert.pem }
                    private_key: { filename: /run/tls/key.pem }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: browser_gateway
                stream_idle_timeout: 30s
                request_timeout: 30s
                max_request_headers_kb: 16
                route_config:
                  name: gateway_only
                  virtual_hosts:
                    - name: gateway
                      domains: ["*"]
                      routes:
                        - match: { path: /spine.auth.AuthenticationService/ResolveContext, headers: [{ name: ":method", exact_match: POST }] }
                          route: { cluster: gateway, timeout: 30s, max_request_bytes: 1048576 }
                        - match: { path: /spine.client.CommandService/Post, headers: [{ name: ":method", exact_match: POST }] }
                          route: { cluster: gateway, timeout: 30s, max_request_bytes: 1048576 }
                        - match: { path: /spine.client.QueryService/Read, headers: [{ name: ":method", exact_match: POST }] }
                          route: { cluster: gateway, timeout: 30s, max_request_bytes: 1048576 }
                        - match: { path: /spine.client.SubscriptionService/Subscribe, headers: [{ name: ":method", exact_match: POST }] }
                          route: { cluster: gateway, timeout: 30s, max_request_bytes: 1048576 }
                        - match: { path: /spine.client.SubscriptionService/Activate, headers: [{ name: ":method", exact_match: POST }] }
                          route: { cluster: gateway, timeout: 0s, max_request_bytes: 1048576 }
                        - match: { path: /spine.client.SubscriptionService/Cancel, headers: [{ name: ":method", exact_match: POST }] }
                          route: { cluster: gateway, timeout: 30s, max_request_bytes: 1048576 }
                      cors:
                        allow_origin_string_match:
                          - exact: https://chat.example.test
                        allow_methods: GET, POST, OPTIONS
                        allow_headers: content-type,x-grpc-web,grpc-timeout,authorization,x-user-agent
                        expose_headers: grpc-status,grpc-message
                        max_age: "86400"
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: gateway
      connect_timeout: 2s
      type: LOGICAL_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9443 }
