name: Publish
on:
  push:
    branches: [master]
concurrency:
  group: spine-npm-publication
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-release
      - run: node scripts/release-cli.mjs preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: gh-actions-environment
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: node --version | grep -Fx 'v24.18.0' && npm --version | grep -Fx '11.16.0'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release
          path: ${{ runner.temp }}/release
      - if: github.run_attempt != '1'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publication-report
          path: ${{ runner.temp }}/prior
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - run: |
          set -euo pipefail
          prior=()
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            prior=(--prior-report "$RUNNER_TEMP/prior/publication-report.json")
          fi
          node scripts/release-cli.mjs publish --input "$RUNNER_TEMP/release" --report "$RUNNER_TEMP/publication-report.json" "${prior[@]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-report
          path: ${{ runner.temp }}/publication-report.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
