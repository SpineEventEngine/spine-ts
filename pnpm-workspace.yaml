packages:
  - "packages/*"
  - "packages/*/test-fixtures"
  - "examples/*"
  - "examples/*/*"
overrides:
  brace-expansion@1.1.18: 1.1.21
  brace-expansion@2.1.2: 2.1.7
  brace-expansion@5.0.8: 5.0.12
  ip-address@10.5.0: 10.7.1
  js-yaml: 4.3.2
  markdown-it@14.2.0: 14.3.1
  nanoid: 3.3.18
  postcss: 8.5.23
  smol-toml: 1.7.1
  source-map-js@1.2.1: 1.2.2
  undici@6.28.0: 6.28.1
  undici@8.9.0: 8.10.2
confirmModulesPurge: false
engineStrict: true
enableGlobalVirtualStore: false
linkWorkspacePackages: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - js-yaml@4.3.0
  - prettier@3.9.0
verifyDepsBeforeRun: error
onlyBuiltDependencies:
  - "@bufbuild/buf"
allowBuilds:
  "@ax-llm/ax": false
  "@bufbuild/buf": true
  esbuild: false
  protobufjs: false
